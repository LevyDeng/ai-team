<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 小队 · 宣传视频画板（柔雾拿铁版）</title>
<style>
  /* Palette C: Soft Mist Latte (#F3ECE3 -> #E7DDD0, roasted coffee bronze #A66A46) */
  :root {
    --bg-top: #f5efe6;
    --bg-mid: #efe7dc;
    --bg-bot: #e6dccf;
    --card: rgba(252, 249, 244, 0.90);
    --card-solid: #fcf9f4;
    --border: rgba(132, 99, 72, 0.17);
    --border-accent: rgba(166, 106, 70, 0.36);
    --accent: #a66a46;
    --accent-deep: #854f30;
    --accent-soft: rgba(166, 106, 70, 0.11);
    --ink: #2f241d;
    --ink-sub: #5f4e42;
    --ink-muted: #8a7768;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg-mid);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Warm Latte atmospheric backdrop */
  #backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 920px 640px at 14% 14%, rgba(255, 250, 242, 0.85), transparent 68%),
      radial-gradient(ellipse 840px 580px at 88% 86%, rgba(196, 144, 102, 0.16), transparent 72%),
      linear-gradient(145deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
    z-index: 0;
  }
  #dot-grid {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(120, 88, 62, 0.09) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 1;
    pointer-events: none;
  }
  #orb-a, #orb-b {
    position: fixed;
    border-radius: 50%;
    filter: blur(95px);
    pointer-events: none;
    z-index: 1;
  }
  #orb-a {
    width: 560px; height: 560px;
    background: rgba(214, 160, 114, 0.18);
    left: -130px; top: -110px;
  }
  #orb-b {
    width: 520px; height: 520px;
    background: rgba(166, 106, 70, 0.13);
    right: -110px; bottom: -130px;
  }

  /* Top chrome bar */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 68px;
    padding: 0 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
  }
  .top-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .top-brand-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(166, 106, 70, 0.45);
  }
  .top-brand span {
    color: var(--ink-muted);
    font-weight: 500;
    font-family: Consolas, monospace;
    font-size: 16px;
  }
  .progress-segs {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-seg {
    width: 44px;
    height: 5px;
    border-radius: 99px;
    background: rgba(132, 99, 72, 0.18);
    overflow: hidden;
    position: relative;
  }
  .progress-seg-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, #b87c56, #8f5635);
    border-radius: 99px;
  }

  /* Slide stage */
  #stage {
    position: fixed;
    inset: 68px 0 98px 0;
    z-index: 10;
  }
  .slide {
    position: absolute;
    inset: 0;
    padding: 16px 64px 14px;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Typography primitives */
  .tag-pill {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    color: var(--accent-deep);
    background: var(--accent-soft);
    border: 1px solid var(--border-accent);
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }
  .steps-layout .tag-pill, .outro-layout .tag-pill {
    align-self: center;
  }
  .tag-pill::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .slide-title {
    font-size: 44px;
    line-height: 1.24;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .lead-box {
    padding: 14px 20px;
    border-left: 4px solid var(--accent);
    background: rgba(252, 249, 244, 0.72);
    border-radius: 0 12px 12px 0;
    font-size: 20px;
    line-height: 1.55;
    color: var(--ink-sub);
    margin-bottom: 22px;
    box-shadow: 0 4px 14px rgba(84, 58, 38, 0.05);
  }

  /* Feature bullet cards */
  .bullet-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .bullet-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 8px 22px rgba(84, 58, 38, 0.07);
  }
  .bullet-check {
    width: 26px; height: 26px;
    flex: none;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--border-accent);
    color: var(--accent-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    margin-top: 2px;
  }
  .bullet-text h4 {
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .bullet-text p {
    font-size: 16.5px;
    line-height: 1.48;
    color: var(--ink-sub);
  }

  .extra-note {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(166, 106, 70, 0.09);
    border: 1px dashed rgba(166, 106, 70, 0.40);
    color: var(--accent-deep);
    font-size: 15.5px;
    line-height: 1.5;
  }

  /* Split Layouts */
  .split-layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 650px 1fr;
    gap: 46px;
    align-items: center;
  }
  .split-layout.media-left {
    grid-template-columns: 1fr 640px;
  }
  .copy-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Light warm app window frame */
  .window-shell {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid rgba(132, 99, 72, 0.24);
    box-shadow:
      0 28px 70px rgba(74, 52, 34, 0.16),
      0 6px 20px rgba(74, 52, 34, 0.08);
  }
  .window-bar {
    height: 38px;
    background: #f2ebe2;
    border-bottom: 1px solid rgba(132, 99, 72, 0.16);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }
  .win-dot { width: 11px; height: 11px; border-radius: 50%; opacity: 0.85; }
  .win-dot.r { background: #e66a5e; }
  .win-dot.y { background: #e8b548; }
  .win-dot.g { background: #59b36b; }
  .win-caption {
    margin-left: 10px;
    font-size: 13.5px;
    color: var(--ink-sub);
    font-weight: 600;
  }
  .window-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #ffffff;
  }
  .window-viewport img.shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
  }

  /* Warm bronze focus spotlight overlay */
  .focus-ring {
    position: absolute;
    border: 3px solid #a66a46;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(47, 36, 29, 0.28), 0 0 24px rgba(166, 106, 70, 0.45);
    pointer-events: none;
    z-index: 6;
  }
  .focus-badge {
    position: absolute;
    left: 0;
    top: -42px;
    background: #854f30;
    border: 1px solid #d4a07a;
    color: #fdf9f4;
    font-size: 15px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(47, 36, 29, 0.25);
  }

  /* Multi-screen tab indicator */
  .sub-tabs {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .sub-tab {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 99px;
    color: var(--ink-muted);
    background: rgba(132, 99, 72, 0.08);
    font-weight: 500;
  }
  .sub-tab.active {
    color: #fcf9f4;
    background: var(--accent);
    font-weight: 600;
  }

  /* Hero Slide (Slide 1) */
  .hero-layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 730px 1fr;
    gap: 44px;
    align-items: center;
  }
  .hero-title {
    font-size: 56px;
    line-height: 1.18;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    color: var(--ink);
  }
  .hero-sub {
    font-size: 25px;
    line-height: 1.48;
    color: var(--accent-deep);
    font-weight: 600;
    margin-bottom: 20px;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 26px;
  }
  .info-pill {
    padding: 8px 16px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink-sub);
    font-size: 16.5px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(84, 58, 38, 0.05);
  }
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .avatar-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .avatar-chip img {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid #d4b89f;
    box-shadow: 0 8px 18px rgba(84, 58, 38, 0.16);
  }
  .avatar-chip span {
    font-size: 13.5px;
    color: var(--ink-sub);
    font-weight: 600;
  }

  /* Theme Split-Wipe (Slide 6) */
  .wipe-dark-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 3;
  }
  .wipe-divider {
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: var(--accent);
    box-shadow: 0 0 18px rgba(166, 106, 70, 0.75);
    z-index: 5;
  }
  .wipe-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent-deep);
    border: 2px solid #f5e6d8;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(47, 36, 29, 0.35);
  }
  .theme-badge {
    position: absolute;
    bottom: 14px;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    z-index: 6;
    box-shadow: 0 6px 16px rgba(47, 36, 29, 0.22);
  }
  .theme-badge.dark { left: 16px; background: rgba(25, 29, 35, 0.92); color: #f3ece3; border: 1px solid rgba(255, 255, 255, 0.2); }
  .theme-badge.light { right: 16px; background: rgba(252, 249, 244, 0.95); color: var(--accent-deep); border: 1px solid var(--border-accent); }

  /* Steps Layout (Slide 7) */
  .steps-layout {
    width: 100%;
    max-width: 1680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .steps-layout .lead-box {
    border-left: none;
    border-radius: 12px;
    padding: 13px 28px;
    max-width: 960px;
    margin-bottom: 40px;
    border: 1px solid var(--border);
  }
  .steps-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 70px 1fr 70px 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 38px;
  }
  .step-card {
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 34px 28px;
    text-align: left;
    min-height: 266px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 38px rgba(84, 58, 38, 0.09);
  }
  .step-num {
    font-family: Consolas, monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-deep);
    background: var(--accent-soft);
    border: 1px solid var(--border-accent);
    width: 54px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .step-card h3 {
    font-size: 27px;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .step-card p {
    font-size: 19px;
    line-height: 1.6;
    color: var(--ink-sub);
  }
  .step-arrow {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .privacy-bar {
    width: 100%;
    max-width: 1220px;
    padding: 17px 28px;
    border-radius: 14px;
    background: rgba(166, 106, 70, 0.10);
    border: 1px solid var(--border-accent);
    color: var(--accent-deep);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
  }

  /* Outro Layout (Slide 8) */
  .outro-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 1240px;
  }
  .outro-avatars {
    display: flex;
    gap: 20px;
    margin-bottom: 32px;
  }
  .outro-avatars img {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #d4b89f;
    box-shadow: 0 12px 26px rgba(84, 58, 38, 0.18);
  }
  .outro-title {
    font-size: 70px;
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .outro-sub {
    font-size: 29px;
    color: var(--ink-sub);
    margin-bottom: 34px;
  }
  .repo-card {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 20px 38px;
    border-radius: 16px;
    background: var(--card-solid);
    border: 2px solid var(--border-accent);
    font-family: Consolas, monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--accent-deep);
    box-shadow: 0 16px 40px rgba(84, 58, 38, 0.14);
    margin-bottom: 24px;
  }
  .outro-foot {
    font-size: 21px;
    color: var(--ink-sub);
    font-weight: 500;
  }

  /* Bottom Subtitle Caption Bar (Warm Espresso Pill for crisp legibility on Latte) */
  #subtitle-wrap {
    position: fixed;
    left: 0; right: 0;
    bottom: 24px;
    display: flex;
    justify-content: center;
    z-index: 30;
    pointer-events: none;
  }
  #subtitle {
    max-width: 1440px;
    padding: 12px 30px;
    border-radius: 14px;
    background: rgba(47, 36, 29, 0.90);
    border: 1px solid rgba(212, 168, 130, 0.35);
    color: #fdf9f4;
    font-size: 25px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.02em;
    box-shadow: 0 10px 28px rgba(47, 36, 29, 0.24);
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="dot-grid"></div>
  <div id="orb-a"></div>
  <div id="orb-b"></div>

  <header id="topbar">
    <div class="top-brand">
      <div class="top-brand-dot"></div>
      AI 小队 <span>/ ai-team</span>
    </div>
    <div class="progress-segs" id="progress-segs"></div>
  </header>

  <main id="stage"></main>

  <div id="subtitle-wrap">
    <div id="subtitle"></div>
  </div>

<script>
const fs = require('node:fs');
const path = require('node:path');
const script = require('./script-data.js');
const manifest = JSON.parse(fs.readFileSync(path.join(__dirname, 'audio/manifest.json'), 'utf8'));

const avatarFiles = [
  { file: 'claude.jpg', label: 'Claude' },
  { file: 'gpt-sol.jpg', label: 'Codex' },
  { file: 'gemini-neon.jpg', label: 'Gemini' },
  { file: 'kimi.jpg', label: 'Cursor' },
  { file: 'deepseek.jpg', label: 'DeepSeek' },
  { file: 'qwen.jpg', label: 'Qwen' },
];
const avatarDir = path.resolve(__dirname, '../desktop/assets/model-avatars');
const avatarSrc = file => 'file:///' + path.join(avatarDir, file).replace(/\\/g, '/');
const screenSrc = rel => 'file:///' + path.join(__dirname, rel).replace(/\\/g, '/');

function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
function easeOutCubic(t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function prog(t, start, dur) { return clamp((t - start) / dur); }

// Clean spoken text for visual subtitles (display @ instead of 艾特)
function toDisplayCaption(text) {
  return text.replace(/艾特/g, '@');
}

function buildSubtitles(text, voiceStart, voiceDur) {
  const parts = text
    .split(/(?<=[。！？，；…])/)
    .map(s => s.trim())
    .filter(Boolean);
  const merged = [];
  for (const part of parts) {
    if (merged.length && merged[merged.length - 1].length < 11) {
      merged[merged.length - 1] += part;
    } else {
      merged.push(part);
    }
  }
  const weights = merged.map(s => s.replace(/[，。！？；、…\s]/g, '').length + 2);
  const total = weights.reduce((a, b) => a + b, 0);
  let cur = voiceStart;
  return merged.map((clause, i) => {
    const dur = (weights[i] / total) * voiceDur;
    const item = {
      text: toDisplayCaption(clause.replace(/[。，；]$/, '')),
      start: cur,
      end: cur + dur,
    };
    cur += dur;
    return item;
  });
}

const timeline = manifest.slides.map((m, idx) => {
  const def = script.slides[idx];
  return {
    ...def,
    ...m,
    index: idx,
    subtitles: buildSubtitles(def.narration, m.voiceStart, m.voiceDuration),
  };
});

// Top chapter indicator
const segHost = document.getElementById('progress-segs');
timeline.forEach(() => {
  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.innerHTML = '<div class="progress-seg-fill"></div>';
  segHost.appendChild(seg);
});
const segFills = [...segHost.querySelectorAll('.progress-seg-fill')];

// Build slides DOM
const stage = document.getElementById('stage');
const slideEls = timeline.map((s) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.id = s.id;

  if (s.layout === 'hero') {
    el.innerHTML = `
      <div class="hero-layout">
        <div class="copy-col">
          <div class="tag-pill anim-head">${s.tag}</div>
          <h1 class="hero-title anim-head">${s.title}</h1>
          <p class="hero-sub anim-head">${s.subtitle}</p>
          <div class="lead-box anim-lead">${s.lead}</div>
          <div class="pill-row anim-pills">
            ${s.pills.map(p => `<span class="info-pill">${p}</span>`).join('')}
          </div>
          <div class="avatar-row">
            ${avatarFiles.map(a => `<div class="avatar-chip anim-avatar"><img src="${avatarSrc(a.file)}" alt=""><span>${a.label}</span></div>`).join('')}
          </div>
        </div>
        <div class="window-shell anim-media">
          <div class="window-bar">
            <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
            <span class="win-caption">AI 小队 · 主工作台界面</span>
          </div>
          <div class="window-viewport">
            <img class="shot hero-shot" src="${screenSrc(s.screen)}" alt="">
          </div>
        </div>
      </div>`;
  } else if (['split-right', 'split-left', 'multi-split-right', 'multi-split-left'].includes(s.layout)) {
    const mediaLeft = s.layout.endsWith('left');
    const multiScreens = s.screens || [{ file: s.screen, tab: null, atRatio: 0, focusBox: s.focusBox || null }];
    const hasTabs = multiScreens.length > 1;
    const copyHtml = `
      <div class="copy-col">
        <div class="tag-pill anim-head">${s.tag}</div>
        <h2 class="slide-title anim-head">${s.title}</h2>
        <div class="lead-box anim-lead">${s.lead}</div>
        <div class="bullet-list">
          ${s.bullets.map(b => `
            <div class="bullet-card anim-bullet">
              <div class="bullet-check">✓</div>
              <div class="bullet-text"><h4>${b.label}</h4><p>${b.desc}</p></div>
            </div>`).join('')}
        </div>
        ${s.extraNote ? `<div class="extra-note anim-extra">${s.extraNote}</div>` : ''}
      </div>`;
    const mediaHtml = `
      <div class="window-shell anim-media">
        <div class="window-bar">
          <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
          <span class="win-caption">${s.screenCaption}</span>
          ${hasTabs ? `<div class="sub-tabs">${multiScreens.map((sc, idx) => `<span class="sub-tab ${idx === 0 ? 'active' : ''}" data-tab="${idx}">${sc.tab}</span>`).join('')}</div>` : ''}
        </div>
        <div class="window-viewport">
          ${multiScreens.map((sc, idx) => `
            <img class="shot multi-shot" data-shot="${idx}" src="${screenSrc(sc.file)}" alt="" style="opacity:${idx === 0 ? 1 : 0}">
            ${sc.focusBox ? `<div class="focus-ring" data-ring="${idx}" style="left:${sc.focusBox.x*100}%;top:${sc.focusBox.y*100}%;width:${sc.focusBox.w*100}%;height:${sc.focusBox.h*100}%;opacity:0"><div class="focus-badge">${sc.focusBox.label}</div></div>` : ''}
          `).join('')}
        </div>
      </div>`;
    el.innerHTML = `<div class="split-layout ${mediaLeft ? 'media-left' : ''}">${mediaLeft ? mediaHtml + copyHtml : copyHtml + mediaHtml}</div>`;
  } else if (s.layout === 'theme-compare') {
    el.innerHTML = `
      <div class="split-layout">
        <div class="copy-col">
          <div class="tag-pill anim-head">${s.tag}</div>
          <h2 class="slide-title anim-head">${s.title}</h2>
          <div class="lead-box anim-lead">${s.lead}</div>
          <div class="bullet-list">
            ${s.bullets.map(b => `
              <div class="bullet-card anim-bullet">
                <div class="bullet-check">✓</div>
                <div class="bullet-text"><h4>${b.label}</h4><p>${b.desc}</p></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="window-shell anim-media">
          <div class="window-bar">
            <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
            <span class="win-caption">${s.screenCaption}</span>
          </div>
          <div class="window-viewport">
            <img class="shot shot-light" src="${screenSrc(s.screenLight)}" alt="">
            <div class="wipe-dark-layer"><img class="shot shot-dark" src="${screenSrc(s.screenDark)}" alt=""></div>
            <div class="wipe-divider"><div class="wipe-knob">↔</div></div>
            <div class="theme-badge dark">深色模式</div>
            <div class="theme-badge light">浅色模式</div>
          </div>
        </div>
      </div>`;
  } else if (s.layout === 'steps') {
    const arrowSvg = `<div class="step-arrow anim-arrow"><svg width="56" height="24" viewBox="0 0 56 24" fill="none"><path d="M4 12H48M48 12L39 4M48 12L39 20" stroke="#a66a46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    el.innerHTML = `
      <div class="steps-layout">
        <div class="tag-pill anim-head">${s.tag}</div>
        <h2 class="slide-title anim-head">${s.title}</h2>
        <div class="lead-box anim-lead">${s.lead}</div>
        <div class="steps-grid">
          ${s.steps.map((st, idx) => `
            <div class="step-card anim-step">
              <div class="step-num">${st.num}</div>
              <h3>${st.title}</h3>
              <p>${st.desc}</p>
            </div>
            ${idx < 2 ? arrowSvg : ''}
          `).join('')}
        </div>
        <div class="privacy-bar anim-privacy">${s.note}</div>
      </div>`;
  } else if (s.layout === 'outro') {
    el.innerHTML = `
      <div class="outro-layout">
        <div class="outro-avatars">
          ${avatarFiles.map(a => `<img class="anim-avatar" src="${avatarSrc(a.file)}" alt="">`).join('')}
        </div>
        <div class="tag-pill anim-head">${s.tag}</div>
        <h1 class="outro-title anim-head">${s.title}</h1>
        <p class="outro-sub anim-head">${s.subtitle}</p>
        <div class="repo-card anim-repo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.95 10.95 0 0 1 5.76 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
          <span>${s.repo}</span>
        </div>
        <p class="outro-foot anim-foot">${s.foot}</p>
      </div>`;
  }

  stage.appendChild(el);
  return el;
});

const orbA = document.getElementById('orb-a');
const orbB = document.getElementById('orb-b');
const subEl = document.getElementById('subtitle');

window.__totalDuration = manifest.totalDuration;
window.__timeline = timeline;

window.__renderAt = function(t) {
  orbA.style.transform = `translate(${Math.sin(t * 0.16) * 38}px, ${Math.cos(t * 0.13) * 26}px)`;
  orbB.style.transform = `translate(${Math.cos(t * 0.15) * 34}px, ${Math.sin(t * 0.11) * 30}px)`;

  const fade = script.meta.transitionSec;
  let activeSub = '';
  let activeSubAlpha = 0;

  timeline.forEach((s, i) => {
    const el = slideEls[i];
    const local = t - s.start;
    const remain = s.duration - local;

    const segP = clamp(local / s.duration);
    segFills[i].style.width = (segP * 100).toFixed(2) + '%';

    if (local < -0.05 || remain < -0.05) {
      el.style.opacity = '0';
      return;
    }

    const enterAlpha = i === 0 ? easeOutCubic(prog(local, 0, 0.55)) : easeOutCubic(prog(local, 0, fade));
    const exitAlpha = i === timeline.length - 1 ? 1 : easeOutCubic(prog(remain, 0, fade));
    const slideAlpha = Math.min(enterAlpha, exitAlpha);
    const enterY = (1 - enterAlpha) * 22;
    const exitY = (1 - exitAlpha) * -16;
    el.style.opacity = slideAlpha.toFixed(4);
    el.style.transform = `translateY(${(enterY + exitY).toFixed(2)}px)`;

    el.querySelectorAll('.anim-head').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.08 + idx * 0.10, 0.52));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 20).toFixed(2)}px)`;
    });
    const lead = el.querySelector('.anim-lead');
    if (lead) {
      const p = easeOutCubic(prog(local, 0.30, 0.52));
      lead.style.opacity = p.toFixed(4);
      lead.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
    }
    const media = el.querySelector('.anim-media');
    if (media) {
      const p = easeOutCubic(prog(local, 0.20, 0.68));
      const scale = 0.95 + 0.05 * p;
      media.style.opacity = p.toFixed(4);
      media.style.transform = `translateY(${((1 - p) * 24).toFixed(2)}px) scale(${scale.toFixed(4)})`;
    }
    const pills = el.querySelector('.anim-pills');
    if (pills) {
      const p = easeOutCubic(prog(local, 0.48, 0.50));
      pills.style.opacity = p.toFixed(4);
      pills.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
    }
    el.querySelectorAll('.anim-avatar').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.60 + idx * 0.09, 0.46));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px) scale(${(0.88 + 0.12 * p).toFixed(4)})`;
    });
    el.querySelectorAll('.anim-bullet').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.55 + idx * 0.32, 0.48));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateX(${((1 - p) * -20).toFixed(2)}px)`;
    });
    const extra = el.querySelector('.anim-extra');
    if (extra) {
      const showAt = Math.max(2.0, s.duration * 0.56);
      const p = easeOutCubic(prog(local, showAt, 0.55));
      extra.style.opacity = p.toFixed(4);
      extra.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
    }

    // Hero shot subtle zoom
    const heroShot = el.querySelector('.hero-shot');
    if (heroShot) {
      const k = clamp(local / s.duration);
      heroShot.style.transform = `scale(${(1.0 + 0.035 * k).toFixed(4)})`;
    }

    // Multi-screen & single-screen showcase transitions + focus rings
    const multiScreens = s.screens || (s.screen ? [{ file: s.screen, atRatio: 0, focusBox: s.focusBox || null }] : []);
    if (multiScreens.length) {
      const shots = el.querySelectorAll('.multi-shot');
      const tabs = el.querySelectorAll('.sub-tab');
      let activeIdx = 0;
      for (let m = 0; m < multiScreens.length; m++) {
        const startM = multiScreens[m].atRatio * s.duration;
        if (local >= startM) activeIdx = m;
      }
      tabs.forEach((tb, idx) => tb.classList.toggle('active', idx === activeIdx));

      shots.forEach((img, m) => {
        const startM = multiScreens[m].atRatio * s.duration;
        const endM = (m + 1 < multiScreens.length ? multiScreens[m + 1].atRatio : 1) * s.duration;
        const segDur = Math.max(0.5, endM - startM);
        let alpha = m === 0 ? 1 : easeInOutCubic(prog(local, startM, 0.65));
        img.style.opacity = alpha.toFixed(4);
        const k = clamp((local - startM) / segDur);
        const baseZ = s.id === 'slide-05' ? 1.05 : 1.0;
        img.style.transform = `scale(${(baseZ + 0.035 * k).toFixed(4)})`;

        const ring = el.querySelector(`.focus-ring[data-ring="${m}"]`);
        if (ring) {
          const rStart = startM + 1.4;
          const rEnd = endM - 0.8;
          if (local < rStart - 0.1 || local > rEnd + 0.6) {
            ring.style.opacity = '0';
          } else {
            const rIn = easeOutCubic(prog(local, rStart, 0.55));
            const rOut = 1 - easeOutCubic(prog(local, rEnd, 0.55));
            ring.style.opacity = Math.min(rIn, rOut).toFixed(4);
          }
        }
      });
    }

    // Slide 6: Smooth Light -> Dark -> split wipe
    const darkLayer = el.querySelector('.wipe-dark-layer');
    const divider = el.querySelector('.wipe-divider');
    if (darkLayer && divider) {
      let pct = 12;
      const t1 = s.duration * 0.22;
      const t2 = s.duration * 0.65;
      const t3 = s.duration * 0.90;
      if (local > t1 && local <= t2) {
        pct = 12 + 72 * easeInOutCubic(prog(local, t1, t2 - t1));
      } else if (local > t2 && local <= t3) {
        pct = 84 - 36 * easeInOutCubic(prog(local, t2, t3 - t2));
      } else if (local > t3) {
        pct = 48;
      }
      darkLayer.style.clipPath = `inset(0 ${(100 - pct).toFixed(2)}% 0 0)`;
      divider.style.left = `calc(${pct.toFixed(2)}% - 2px)`;
    }

    // Slide 7: 3 steps + arrows + privacy bar
    el.querySelectorAll('.anim-step').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.55 + idx * 0.95, 0.55));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 24).toFixed(2)}px)`;
    });
    el.querySelectorAll('.anim-arrow').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 1.15 + idx * 0.95, 0.42));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateX(${((1 - p) * -12).toFixed(2)}px)`;
    });
    const priv = el.querySelector('.anim-privacy');
    if (priv) {
      const p = easeOutCubic(prog(local, 3.3, 0.55));
      priv.style.opacity = p.toFixed(4);
      priv.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
    }

    // Slide 8: Outro
    const repo = el.querySelector('.anim-repo');
    if (repo) {
      const p = easeOutCubic(prog(local, 0.50, 0.60));
      repo.style.opacity = p.toFixed(4);
      repo.style.transform = `scale(${(0.93 + 0.07 * p).toFixed(4)})`;
    }
    const foot = el.querySelector('.anim-foot');
    if (foot) {
      const p = easeOutCubic(prog(local, 0.90, 0.52));
      foot.style.opacity = p.toFixed(4);
    }

    // Subtitles
    if (local >= 0 && local <= s.duration) {
      for (const sub of s.subtitles) {
        if (t >= sub.start - 0.05 && t <= sub.end + 0.12) {
          activeSub = sub.text;
          const fadeIn = easeOutCubic(prog(t, sub.start - 0.05, 0.16));
          const fadeOut = easeOutCubic(prog(sub.end + 0.12 - t, 0, 0.16));
          activeSubAlpha = Math.min(fadeIn, fadeOut);
          break;
        }
      }
    }
  });

  if (activeSub && activeSubAlpha > 0.01) {
    subEl.textContent = activeSub;
    subEl.style.opacity = activeSubAlpha.toFixed(4);
  } else {
    subEl.style.opacity = '0';
  }
};

window.__ready = Promise.all(
  [...document.images].map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; }))
).then(() => {
  window.__renderAt(0);
  return { totalDuration: manifest.totalDuration, slides: timeline.length };
});
</script>
</body>
</html>
