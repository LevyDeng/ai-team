<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 小队 · 宣传视频画板</title>
<style>
  :root {
    --bg-deep: #0f1318;
    --bg-mid: #161c23;
    --surface: rgba(28, 35, 44, 0.84);
    --surface-solid: #1b222b;
    --border: rgba(255, 255, 255, 0.09);
    --border-accent: rgba(45, 200, 108, 0.34);
    --green: #1db954;
    --green-soft: #8bdda7;
    --green-glow: rgba(23, 167, 78, 0.16);
    --ink: #eef3f8;
    --ink-sub: #a8b3c1;
    --ink-muted: #7b8696;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Layered atmospheric backdrop */
  #backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 620px at 18% 16%, rgba(23, 167, 78, 0.12), transparent 68%),
      radial-gradient(ellipse 780px 560px at 84% 82%, rgba(45, 196, 120, 0.09), transparent 70%),
      linear-gradient(145deg, #0e1217 0%, #151b22 52%, #11161d 100%);
    z-index: 0;
  }
  #dot-grid {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 1;
    pointer-events: none;
  }
  #orb-a, #orb-b {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 1;
  }
  #orb-a {
    width: 560px; height: 560px;
    background: rgba(23, 167, 78, 0.14);
    left: -120px; top: -100px;
  }
  #orb-b {
    width: 500px; height: 500px;
    background: rgba(88, 204, 140, 0.09);
    right: -110px; bottom: -120px;
  }

  /* Top chrome bar */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 68px;
    padding: 0 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
  }
  .top-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .top-brand-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 14px rgba(29, 185, 84, 0.8);
  }
  .top-brand span {
    color: var(--ink-muted);
    font-weight: 500;
    font-family: Consolas, monospace;
    font-size: 16px;
  }
  .progress-segs {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-seg {
    width: 44px;
    height: 5px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
    position: relative;
  }
  .progress-seg-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, #17a74e, #7ee2a8);
    border-radius: 99px;
  }

  /* Slide stage */
  #stage {
    position: fixed;
    inset: 68px 0 96px 0;
    z-index: 10;
  }
  .slide {
    position: absolute;
    inset: 0;
    padding: 18px 64px 16px;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Typography primitives */
  .tag-pill {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    color: var(--green-soft);
    background: rgba(23, 167, 78, 0.14);
    border: 1px solid var(--border-accent);
    letter-spacing: 0.03em;
    margin-bottom: 18px;
  }
  .steps-layout .tag-pill, .outro-layout .tag-pill {
    align-self: center;
  }
  .tag-pill::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
  }
  .slide-title {
    font-size: 46px;
    line-height: 1.24;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #f4f8fc;
    margin-bottom: 18px;
  }
  .pain-box {
    padding: 15px 20px;
    border-left: 4px solid var(--green);
    background: rgba(23, 167, 78, 0.08);
    border-radius: 0 12px 12px 0;
    font-size: 20px;
    line-height: 1.55;
    color: #d3e5da;
    margin-bottom: 24px;
  }
  .pain-box strong {
    color: var(--green-soft);
    font-weight: 700;
  }

  /* Feature bullet cards */
  .bullet-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .bullet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
  }
  .bullet-check {
    width: 26px; height: 26px;
    flex: none;
    border-radius: 8px;
    background: rgba(23, 167, 78, 0.18);
    border: 1px solid rgba(139, 221, 167, 0.32);
    color: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    margin-top: 2px;
  }
  .bullet-text h4 {
    font-size: 21px;
    font-weight: 700;
    color: #f2f6fa;
    margin-bottom: 4px;
  }
  .bullet-text p {
    font-size: 16.5px;
    line-height: 1.48;
    color: var(--ink-sub);
  }

  /* Split Layouts */
  .split-layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 650px 1fr;
    gap: 48px;
    align-items: center;
  }
  .split-layout.media-left {
    grid-template-columns: 1fr 640px;
  }
  .copy-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Browser/App window showcase frame */
  .window-shell {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #141920;
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.58),
      0 0 0 1px rgba(23, 167, 78, 0.14);
  }
  .window-bar {
    height: 36px;
    background: #1d242e;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }
  .win-dot { width: 11px; height: 11px; border-radius: 50%; opacity: 0.85; }
  .win-dot.r { background: #ef5b56; }
  .win-dot.y { background: #f2be42; }
  .win-dot.g { background: #37c85c; }
  .win-caption {
    margin-left: 10px;
    font-size: 13.5px;
    color: var(--ink-sub);
    font-weight: 500;
  }
  .window-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #191d23;
  }
  .window-viewport img.shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
  }

  /* Focus spotlight overlay */
  .focus-ring {
    position: absolute;
    border: 3px solid #4ade80;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(8, 12, 16, 0.42), 0 0 28px rgba(74, 222, 128, 0.55);
    pointer-events: none;
    z-index: 6;
  }
  .focus-badge {
    position: absolute;
    left: 0;
    top: -42px;
    background: #14532d;
    border: 1px solid #4ade80;
    color: #ecfdf5;
    font-size: 15px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  /* Dual screen switcher pill (Slide 3) */
  .sub-tabs {
    position: absolute;
    right: 14px;
    top: 6px;
    display: flex;
    gap: 6px;
  }
  .sub-tab {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 99px;
    color: var(--ink-muted);
    background: rgba(255,255,255,0.06);
  }
  .sub-tab.active {
    color: #ecfdf5;
    background: #17a74e;
    font-weight: 600;
  }

  /* Hero Slide (Slide 1) */
  .hero-layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 730px 1fr;
    gap: 44px;
    align-items: center;
  }
  .hero-title {
    font-size: 66px;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    background: linear-gradient(120deg, #ffffff 35%, #9ee0b4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-size: 27px;
    line-height: 1.45;
    color: #dce5ee;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }
  .info-pill {
    padding: 8px 16px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.11);
    color: #d6e2ec;
    font-size: 16.5px;
    font-weight: 600;
  }
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .avatar-chip img {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(139, 221, 167, 0.55);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
  }
  .avatar-chip span {
    font-size: 13px;
    color: var(--ink-sub);
    font-weight: 600;
  }

  /* Agent logo strip (Slide 4) */
  .agent-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }
  .agent-chip {
    padding: 6px 13px;
    border-radius: 8px;
    background: rgba(23, 167, 78, 0.10);
    border: 1px solid rgba(139, 221, 167, 0.25);
    color: #bcebd0;
    font-family: Consolas, "Microsoft YaHei UI", monospace;
    font-size: 14.5px;
    font-weight: 600;
  }

  /* Theme Split-Wipe (Slide 6) */
  .wipe-light-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 3;
  }
  .wipe-divider {
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: #4ade80;
    box-shadow: 0 0 22px rgba(74, 222, 128, 0.9);
    z-index: 5;
  }
  .wipe-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #14532d;
    border: 2px solid #86efac;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .theme-badge {
    position: absolute;
    bottom: 14px;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    z-index: 6;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);
  }
  .theme-badge.light { left: 16px; background: rgba(255,255,255,0.92); color: #14532d; border: 1px solid #86efac; }
  .theme-badge.dark { right: 16px; background: rgba(22,27,33,0.9); color: #8bdda7; border: 1px solid rgba(139,221,167,0.35); }

  /* Steps Layout (Slide 7) */
  .steps-layout {
    width: 100%;
    max-width: 1680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .steps-layout .pain-box {
    border-left: none;
    border-radius: 12px;
    padding: 14px 28px;
    max-width: 980px;
    margin-bottom: 42px;
  }
  .steps-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 70px 1fr 70px 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }
  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 34px 28px;
    text-align: left;
    min-height: 270px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
  }
  .step-num {
    font-family: Consolas, monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--green-soft);
    background: rgba(23, 167, 78, 0.16);
    border: 1px solid var(--border-accent);
    width: 54px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .step-card h3 {
    font-size: 27px;
    color: #f4f8fc;
    margin-bottom: 14px;
  }
  .step-card p {
    font-size: 19px;
    line-height: 1.62;
    color: var(--ink-sub);
  }
  .step-arrow {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .privacy-bar {
    width: 100%;
    max-width: 1260px;
    padding: 18px 28px;
    border-radius: 14px;
    background: rgba(23, 167, 78, 0.10);
    border: 1px solid var(--border-accent);
    color: #d6efe0;
    font-size: 19px;
    line-height: 1.5;
  }

  /* Outro Layout (Slide 8) */
  .outro-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 1240px;
  }
  .outro-avatars {
    display: flex;
    gap: 20px;
    margin-bottom: 34px;
  }
  .outro-avatars img {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid rgba(139, 221, 167, 0.65);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .outro-title {
    font-size: 72px;
    font-weight: 800;
    margin-bottom: 16px;
    background: linear-gradient(120deg, #ffffff 30%, #8bdda7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .outro-sub {
    font-size: 30px;
    color: #d4e0ec;
    margin-bottom: 36px;
  }
  .repo-card {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 20px 38px;
    border-radius: 16px;
    background: rgba(23, 167, 78, 0.14);
    border: 1.5px solid rgba(139, 221, 167, 0.48);
    font-family: Consolas, monospace;
    font-size: 30px;
    font-weight: 700;
    color: #f0fdf4;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
    margin-bottom: 24px;
  }
  .outro-foot {
    font-size: 20px;
    color: var(--ink-sub);
  }

  /* Bottom Subtitle Caption Bar */
  #subtitle-wrap {
    position: fixed;
    left: 0; right: 0;
    bottom: 24px;
    display: flex;
    justify-content: center;
    z-index: 30;
    pointer-events: none;
  }
  #subtitle {
    max-width: 1420px;
    padding: 12px 30px;
    border-radius: 14px;
    background: rgba(12, 16, 22, 0.84);
    border: 1px solid rgba(139, 221, 167, 0.25);
    color: #f3f7fb;
    font-size: 25px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="dot-grid"></div>
  <div id="orb-a"></div>
  <div id="orb-b"></div>

  <header id="topbar">
    <div class="top-brand">
      <div class="top-brand-dot"></div>
      AI 小队 <span>/ ai-team</span>
    </div>
    <div class="progress-segs" id="progress-segs"></div>
  </header>

  <main id="stage"></main>

  <div id="subtitle-wrap">
    <div id="subtitle"></div>
  </div>

<script>
const fs = require('node:fs');
const path = require('node:path');
const script = require('./script-data.js');
const manifest = JSON.parse(fs.readFileSync(path.join(__dirname, 'audio/manifest.json'), 'utf8'));

const avatarFiles = [
  { file: 'claude.jpg', label: 'Claude' },
  { file: 'gpt-sol.jpg', label: 'Codex' },
  { file: 'gemini-neon.jpg', label: 'Gemini' },
  { file: 'kimi.jpg', label: 'Kimi' },
  { file: 'deepseek.jpg', label: 'DeepSeek' },
  { file: 'qwen.jpg', label: 'Qwen' },
];
const avatarDir = path.resolve(__dirname, '../desktop/assets/model-avatars');
const avatarSrc = file => 'file:///' + path.join(avatarDir, file).replace(/\\/g, '/');
const screenSrc = rel => 'file:///' + path.join(__dirname, rel).replace(/\\/g, '/');

function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
function easeOutCubic(t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function prog(t, start, dur) { return clamp((t - start) / dur); }

// Split narration into natural Chinese subtitle clauses weighted by char length
function buildSubtitles(text, voiceStart, voiceDur) {
  const parts = text
    .split(/(?<=[。！？，；])/)
    .map(s => s.trim())
    .filter(Boolean);
  // Merge very short clauses with neighbor so captions stay balanced
  const merged = [];
  for (const part of parts) {
    if (merged.length && merged[merged.length - 1].length < 11) {
      merged[merged.length - 1] += part;
    } else {
      merged.push(part);
    }
  }
  const weights = merged.map(s => s.replace(/[，。！？；、\s]/g, '').length + 2);
  const total = weights.reduce((a, b) => a + b, 0);
  let cur = voiceStart;
  return merged.map((clause, i) => {
    const dur = (weights[i] / total) * voiceDur;
    const item = { text: clause.replace(/[。，；]$/, ''), start: cur, end: cur + dur };
    cur += dur;
    return item;
  });
}

const timeline = manifest.slides.map((m, idx) => {
  const def = script.slides[idx];
  return {
    ...def,
    ...m,
    index: idx,
    subtitles: buildSubtitles(def.narration, m.voiceStart, m.voiceDuration),
  };
});

// Build top progress indicator
const segHost = document.getElementById('progress-segs');
timeline.forEach(() => {
  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.innerHTML = '<div class="progress-seg-fill"></div>';
  segHost.appendChild(seg);
});
const segFills = [...segHost.querySelectorAll('.progress-seg-fill')];

// Build slides DOM
const stage = document.getElementById('stage');
const slideEls = timeline.map((s) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.id = s.id;

  if (s.layout === 'hero') {
    el.innerHTML = `
      <div class="hero-layout">
        <div class="copy-col">
          <div class="tag-pill anim-head">${s.tag}</div>
          <h1 class="hero-title anim-head">${s.title}</h1>
          <p class="hero-sub anim-head">${s.subtitle}</p>
          <div class="pain-box anim-pain">${s.pain}</div>
          <div class="pill-row anim-pills">
            ${s.pills.map(p => `<span class="info-pill">${p}</span>`).join('')}
          </div>
          <div class="avatar-row">
            ${avatarFiles.map(a => `<div class="avatar-chip anim-avatar"><img src="${avatarSrc(a.file)}" alt=""><span>${a.label}</span></div>`).join('')}
          </div>
        </div>
        <div class="window-shell anim-media">
          <div class="window-bar">
            <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
            <span class="win-caption">AI 小队 · 主工作台界面</span>
          </div>
          <div class="window-viewport">
            <img class="shot hero-shot" src="${screenSrc(s.screen)}" alt="">
          </div>
        </div>
      </div>`;
  } else if (s.layout === 'split-right' || s.layout === 'split-left') {
    const mediaLeft = s.layout === 'split-left';
    const isDual = Boolean(s.secondaryScreen);
    const agentStrip = s.id === 'slide-04'
      ? `<div class="agent-chips anim-extra">
          <span class="agent-chip">Claude Code</span>
          <span class="agent-chip">Codex CLI</span>
          <span class="agent-chip">Antigravity</span>
          <span class="agent-chip">Kimi Code</span>
          <span class="agent-chip">CodeBuddy</span>
          <span class="agent-chip">Linux VPS (SSH)</span>
        </div>`
      : '';
    const copyHtml = `
      <div class="copy-col">
        <div class="tag-pill anim-head">${s.tag}</div>
        <h2 class="slide-title anim-head">${s.title}</h2>
        <div class="pain-box anim-pain"><strong>解决痛点：</strong>${s.pain}</div>
        <div class="bullet-list">
          ${s.bullets.map(b => `
            <div class="bullet-card anim-bullet">
              <div class="bullet-check">✓</div>
              <div class="bullet-text"><h4>${b.label}</h4><p>${b.desc}</p></div>
            </div>`).join('')}
        </div>
        ${agentStrip}
      </div>`;
    const mediaHtml = `
      <div class="window-shell anim-media">
        <div class="window-bar">
          <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
          <span class="win-caption">${s.screenCaption}</span>
          ${isDual ? `<div class="sub-tabs"><span class="sub-tab active tab-a">工作流执行</span><span class="sub-tab tab-b">角色优先级表</span></div>` : ''}
        </div>
        <div class="window-viewport">
          <img class="shot shot-primary" src="${screenSrc(s.screen)}" alt="">
          ${isDual ? `<img class="shot shot-secondary" src="${screenSrc(s.secondaryScreen)}" alt="" style="opacity:0">` : ''}
          ${s.focusBox ? `<div class="focus-ring" style="left:${s.focusBox.x*100}%;top:${s.focusBox.y*100}%;width:${s.focusBox.w*100}%;height:${s.focusBox.h*100}%;opacity:0"><div class="focus-badge">${s.focusBox.label}</div></div>` : ''}
        </div>
      </div>`;
    el.innerHTML = `<div class="split-layout ${mediaLeft ? 'media-left' : ''}">${mediaLeft ? mediaHtml + copyHtml : copyHtml + mediaHtml}</div>`;
  } else if (s.layout === 'theme-compare') {
    el.innerHTML = `
      <div class="split-layout">
        <div class="copy-col">
          <div class="tag-pill anim-head">${s.tag}</div>
          <h2 class="slide-title anim-head">${s.title}</h2>
          <div class="pain-box anim-pain"><strong>解决痛点：</strong>${s.pain}</div>
          <div class="bullet-list">
            ${s.bullets.map(b => `
              <div class="bullet-card anim-bullet">
                <div class="bullet-check">✓</div>
                <div class="bullet-text"><h4>${b.label}</h4><p>${b.desc}</p></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="window-shell anim-media">
          <div class="window-bar">
            <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
            <span class="win-caption">${s.screenCaption}</span>
          </div>
          <div class="window-viewport">
            <img class="shot shot-dark" src="${screenSrc(s.screenDark)}" alt="">
            <div class="wipe-light-layer"><img class="shot shot-light" src="${screenSrc(s.screenLight)}" alt=""></div>
            <div class="wipe-divider"><div class="wipe-knob">↔</div></div>
            <div class="theme-badge light">浅色模式</div>
            <div class="theme-badge dark">深色模式</div>
          </div>
        </div>
      </div>`;
  } else if (s.layout === 'steps') {
    const arrowSvg = `<div class="step-arrow anim-arrow"><svg width="56" height="24" viewBox="0 0 56 24" fill="none"><path d="M4 12H48M48 12L39 4M48 12L39 20" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    el.innerHTML = `
      <div class="steps-layout">
        <div class="tag-pill anim-head">${s.tag}</div>
        <h2 class="slide-title anim-head">${s.title}</h2>
        <div class="pain-box anim-pain">${s.pain}</div>
        <div class="steps-grid">
          ${s.steps.map((st, idx) => `
            <div class="step-card anim-step">
              <div class="step-num">${st.num}</div>
              <h3>${st.title}</h3>
              <p>${st.desc}</p>
            </div>
            ${idx < 2 ? arrowSvg : ''}
          `).join('')}
        </div>
        <div class="privacy-bar anim-privacy">${s.note}</div>
      </div>`;
  } else if (s.layout === 'outro') {
    el.innerHTML = `
      <div class="outro-layout">
        <div class="outro-avatars">
          ${avatarFiles.map(a => `<img class="anim-avatar" src="${avatarSrc(a.file)}" alt="">`).join('')}
        </div>
        <div class="tag-pill anim-head">${s.tag}</div>
        <h1 class="outro-title anim-head">${s.title}</h1>
        <p class="outro-sub anim-head">${s.subtitle}</p>
        <div class="repo-card anim-repo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.95 10.95 0 0 1 5.76 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
          <span>${s.repo}</span>
        </div>
        <p class="outro-foot anim-foot">${s.foot}</p>
      </div>`;
  }

  stage.appendChild(el);
  return el;
});

const orbA = document.getElementById('orb-a');
const orbB = document.getElementById('orb-b');
const subEl = document.getElementById('subtitle');

window.__totalDuration = manifest.totalDuration;
window.__timeline = timeline;

window.__renderAt = function(t) {
  // Subtle living background motion
  orbA.style.transform = `translate(${Math.sin(t * 0.18) * 42}px, ${Math.cos(t * 0.14) * 28}px)`;
  orbB.style.transform = `translate(${Math.cos(t * 0.16) * 38}px, ${Math.sin(t * 0.12) * 32}px)`;

  const fade = script.meta.transitionSec;
  let activeSub = '';
  let activeSubAlpha = 0;

  timeline.forEach((s, i) => {
    const el = slideEls[i];
    const local = t - s.start;
    const remain = s.duration - local;

    // Progress bar segment
    const segP = clamp(local / s.duration);
    segFills[i].style.width = (segP * 100).toFixed(2) + '%';

    // Visible window (with slight crossfade overlap)
    if (local < -0.05 || remain < -0.05) {
      el.style.opacity = '0';
      return;
    }

    const enterAlpha = i === 0 ? easeOutCubic(prog(local, 0, 0.55)) : easeOutCubic(prog(local, 0, fade));
    const exitAlpha = i === timeline.length - 1 ? 1 : easeOutCubic(prog(remain, 0, fade));
    const slideAlpha = Math.min(enterAlpha, exitAlpha);
    const enterY = (1 - enterAlpha) * 24;
    const exitY = (1 - exitAlpha) * -18;
    el.style.opacity = slideAlpha.toFixed(4);
    el.style.transform = `translateY(${(enterY + exitY).toFixed(2)}px)`;

    // Animate heads & pain box
    el.querySelectorAll('.anim-head').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.08 + idx * 0.11, 0.55));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 22).toFixed(2)}px)`;
    });
    const pain = el.querySelector('.anim-pain');
    if (pain) {
      const p = easeOutCubic(prog(local, 0.34, 0.55));
      pain.style.opacity = p.toFixed(4);
      pain.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px)`;
    }

    // Animate media frame
    const media = el.querySelector('.anim-media');
    if (media) {
      const p = easeOutCubic(prog(local, 0.22, 0.72));
      const scale = 0.94 + 0.06 * p;
      media.style.opacity = p.toFixed(4);
      media.style.transform = `translateY(${((1 - p) * 26).toFixed(2)}px) scale(${scale.toFixed(4)})`;
    }

    // Hero pills & avatars
    const pills = el.querySelector('.anim-pills');
    if (pills) {
      const p = easeOutCubic(prog(local, 0.52, 0.55));
      pills.style.opacity = p.toFixed(4);
      pills.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
    }
    el.querySelectorAll('.anim-avatar').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.65 + idx * 0.10, 0.50));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px) scale(${(0.86 + 0.14 * p).toFixed(4)})`;
    });

    // Staggered bullet cards
    el.querySelectorAll('.anim-bullet').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.62 + idx * 0.35, 0.52));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateX(${((1 - p) * -22).toFixed(2)}px)`;
    });

    const extra = el.querySelector('.anim-extra');
    if (extra) {
      const p = easeOutCubic(prog(local, 1.85, 0.55));
      extra.style.opacity = p.toFixed(4);
      extra.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
    }

    // Subtle Ken Burns gentle zoom on single screenshots
    const shotPrimary = el.querySelector('.shot-primary, .hero-shot');
    if (shotPrimary) {
      const k = clamp(local / s.duration);
      const z = s.id === 'slide-05' ? (1.06 + 0.04 * k) : (1.0 + 0.045 * k);
      shotPrimary.style.transform = `scale(${z.toFixed(4)})`;
    }

    // Slide 2: animated focus spotlight ring over @ mention & queue area
    const ring = el.querySelector('.focus-ring');
    if (ring) {
      const showIn = easeOutCubic(prog(local, 3.2, 0.65));
      const hideOut = 1 - easeOutCubic(prog(local, s.duration - 2.0, 0.65));
      const a = Math.min(showIn, hideOut);
      ring.style.opacity = a.toFixed(4);
      ring.style.transform = `scale(${(1.04 - 0.04 * showIn).toFixed(4)})`;
    }

    // Slide 3: smooth dual-screenshot crossfade (Workflow execution -> Role Priority table)
    const shotSecondary = el.querySelector('.shot-secondary');
    if (shotSecondary) {
      const switchAt = s.duration * 0.48;
      const mix = easeInOutCubic(prog(local, switchAt, 0.75));
      shotSecondary.style.opacity = mix.toFixed(4);
      shotSecondary.style.transform = `scale(${(1.0 + 0.03 * clamp((local - switchAt) / (s.duration - switchAt))).toFixed(4)})`;
      const tabA = el.querySelector('.tab-a');
      const tabB = el.querySelector('.tab-b');
      if (tabA && tabB) {
        tabA.classList.toggle('active', mix < 0.5);
        tabB.classList.toggle('active', mix >= 0.5);
      }
    }

    // Slide 6: smooth Dark <-> Light theme comparison wipe
    const lightLayer = el.querySelector('.wipe-light-layer');
    const divider = el.querySelector('.wipe-divider');
    if (lightLayer && divider) {
      // Sweep from 18% -> 84% -> settle at 52%
      let pct = 18;
      if (local > 2.2 && local <= 8.5) {
        pct = 18 + 66 * easeInOutCubic(prog(local, 2.2, 6.3));
      } else if (local > 8.5 && local <= 13.5) {
        pct = 84 - 32 * easeInOutCubic(prog(local, 8.5, 5.0));
      } else if (local > 13.5) {
        pct = 52;
      }
      lightLayer.style.clipPath = `inset(0 ${(100 - pct).toFixed(2)}% 0 0)`;
      divider.style.left = `calc(${pct.toFixed(2)}% - 2px)`;
    }

    // Slide 7: 3-step cards + arrows + privacy bar
    el.querySelectorAll('.anim-step').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 0.75 + idx * 1.15, 0.58));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateY(${((1 - p) * 28).toFixed(2)}px)`;
    });
    el.querySelectorAll('.anim-arrow').forEach((node, idx) => {
      const p = easeOutCubic(prog(local, 1.45 + idx * 1.15, 0.45));
      node.style.opacity = p.toFixed(4);
      node.style.transform = `translateX(${((1 - p) * -14).toFixed(2)}px)`;
    });
    const priv = el.querySelector('.anim-privacy');
    if (priv) {
      const p = easeOutCubic(prog(local, 4.4, 0.6));
      priv.style.opacity = p.toFixed(4);
      priv.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px)`;
    }

    // Slide 8: Repo card & foot
    const repo = el.querySelector('.anim-repo');
    if (repo) {
      const p = easeOutCubic(prog(local, 0.55, 0.65));
      repo.style.opacity = p.toFixed(4);
      repo.style.transform = `scale(${(0.92 + 0.08 * p).toFixed(4)})`;
    }
    const foot = el.querySelector('.anim-foot');
    if (foot) {
      const p = easeOutCubic(prog(local, 0.95, 0.55));
      foot.style.opacity = p.toFixed(4);
    }

    // Subtitles check
    if (local >= 0 && local <= s.duration) {
      for (const sub of s.subtitles) {
        if (t >= sub.start - 0.05 && t <= sub.end + 0.12) {
          activeSub = sub.text;
          const fadeIn = easeOutCubic(prog(t, sub.start - 0.05, 0.18));
          const fadeOut = easeOutCubic(prog(sub.end + 0.12 - t, 0, 0.18));
          activeSubAlpha = Math.min(fadeIn, fadeOut);
          break;
        }
      }
    }
  });

  if (activeSub && activeSubAlpha > 0.01) {
    subEl.textContent = activeSub;
    subEl.style.opacity = activeSubAlpha.toFixed(4);
  } else {
    subEl.style.opacity = '0';
  }
};

// Wait until all images are decoded
window.__ready = Promise.all(
  [...document.images].map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; }))
).then(() => {
  window.__renderAt(0);
  return { totalDuration: manifest.totalDuration, slides: timeline.length };
});
</script>
</body>
</html>
